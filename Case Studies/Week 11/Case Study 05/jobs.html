  <head>
    <meta charset="UTF-8" />

    <script src="formvalidation.js" defer></script>
    <link rel="stylesheet" href="javajam.css" />

    <style>
      .error-message {
        display: inline-block;
        color: red;
        font-size: 0.9em;
        margin-left: 10px;
      }
      input:invalid,
      textarea:invalid {
        border-color: red;
      }

      /* Center the form table */
      table {
        width: 500px;
        margin-left: auto;
        margin-right: auto;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <header></header>
      <div id="leftcolumn">
        <nav>
          <a href="index.html">Home</a>
          <a href="menu.php">Menu</a>
          <a href="music.html">Music</a>
          <a href="jobs.html">Jobs</a>
          <hr />
          <b>Admin</b>
          <a href="update_price.php">Update Prices</a>
          <a href="sales_report.php">Sales Report</a>
        </nav>
      </div>
      <div id="rightcolumn">
        <div class="content">
          <h2>Jobs at JavaJam</h2>
          <p>
            Want to work at JavaJam? Fill up the form below to send in your
            application. Required field are marked with a asterisks *
          </p>
          <form action="show_post.php" method="post">
            <table>
              <tr>
                <td align="left"><label for="name">*Name</label></td>
                <td align="left">
                  <input
                    type="text"
                    name="name"
                    size="30"
                    required="required"
                    id="name"
                  />
                </td>
              </tr>
              <tr>
                <td align="left">*Email:</td>
                <td align="left">
                  <input
                    type="text"
                    name="email"
                    size="30"
                    required="required"
                    id="email"
                  />
                </td>
              </tr>
              <tr>
                <td align="left"><label for="position">*Position</label></td>
                <td align="left">
                  <select name="position" required="required">
                    <option value="barista">Barista</option>
                    <option value="cashier">Cashier</option>
                    <option value="cook">Cook</option>
                    <option value="delivery">Delivery Driver</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td align="left"><label for="startDate">*Start Date</label></td>
                <td align="left">
                  <input
                    type="date"
                    name="startDate"
                    size="30"
                    required="required"
                    id="startDate"
                  />
                </td>
              </tr>
              <tr>
                <td align="left">
                  <label for="experience">*Experience</label>
                </td>
                <td align="left">
                  <textarea
                    name="experience"
                    rows="4"
                    cols="23"
                    required="required"
                    id="experience"
                  ></textarea>
                </td>
              </tr>
              <tr>
                <td align="left"><label for="education">*Education</label></td>
                <td align="left">
                  <textarea
                    name="education"
                    rows="4"
                    cols="23"
                    required="required"
                    id="education"
                  ></textarea>
                </td>
              </tr>
              <tr>
                <td align="left"><label for="resume">*Resume</label></td>
                <td align="left">
                  <input
                    type="file"
                    name="resume"
                    id="resume"
                    accept=".pdf, .doc, .docx"
                    required
                  />
                </td>
              </tr>
              <tr>
                <td colspan="2" align="center">
                  <input type="submit" value="Submit Application" />
                </td>
              </tr>
            </table>
          </form>
        </div>
      </div>
      <footer>
        <i>
          <p>
            Copyright &copy 2014 JavaJam Coffee House<br /><u
              ><a href="mailto:your_email@domain.com"
                >azfarnasri@binazman.com</a
              ></u
            >
          </p>
        </i>
      </footer>
    </div>
  </body>
</html>
